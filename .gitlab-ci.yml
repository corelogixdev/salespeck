
stages:
  - build
  - publish

variables:
  ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
  ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"

cache:
  paths:
    - .cache/electron
    - .cache/electron-builder

build:
  stage: build
  image: electronuserland/builder:wine
  script:
    - npm install
    - npm run build
  artifacts:
    paths:
      - dist/

publish:
  stage: publish
  image: alpine:latest
  dependencies:
    - build
  script:
    - apk add --no-cache curl
    - curl --header "PRIVATE-TOKEN: $CI_JOB_TOKEN" --upload-file dist/*.exe "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/packages/generic/openmenu/$CI_COMMIT_REF_NAME/openmenu.exe"
  only:
    - main